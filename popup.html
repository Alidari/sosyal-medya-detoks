<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  body { width: 250px; margin: 0; padding: 18px; background: #000; color: #e7e9ea;
         font-family: "Segoe UI", system-ui, sans-serif; }
  h2 { font-size: 16px; font-weight: 800; margin: 0 0 14px; }
  label { display: flex; align-items: center; justify-content: space-between; font-size: 14px; cursor: pointer;
          padding: 12px 0; border-top: 1px solid #2f3336; border-bottom: 1px solid #2f3336; }
  input { accent-color: #1d9bf0; width: 18px; height: 18px; }
  small { display: block; margin-top: 12px; color: #71767b; font-size: 12px; line-height: 1.4; }
</style>
</head>
<body>
  <h2>Sosyal Medya Detoksu</h2>
  <label>x.com uyarısı <input type="checkbox" id="toggle"></label>
  <label style="border-top:0">GTA 6 tweet bulanıklaştırma <input type="checkbox" id="gta"></label>
  <small id="info"></small>
  <script src="popup.js"></script>
</body>
</html>
